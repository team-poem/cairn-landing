name: harness-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  hooks:
    name: 훅·루프 검증
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'poem-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sh tests/hooks.sh
      - run: sh tests/loop.sh
      - run: sh tests/sobaya.sh
      - run: python3 tests/prune-workflow.test.py
  collab:
    name: 협업 규칙 검사
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'poem-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin "${{ github.base_ref }}"
      - run: sh scripts/collab.sh check --base "origin/${{ github.base_ref }}"
        env: { GITHUB_HEAD_REF: "${{ github.head_ref }}" }
  prune:
    name: claim 정리 (main)
    concurrency:
      group: collab-prune
      cancel-in-progress: false
    if: github.event_name == 'push'
    runs-on: poem-public
    permissions: { contents: write, pull-requests: write }
    steps:
      - name: gh CLI 준비 (self-hosted 이미지에는 없음)
        run: |
          command -v gh >/dev/null && exit 0
          v=2.103.3 a=$(dpkg --print-architecture)
          curl -fsSL "https://github.com/cli/cli/releases/download/v$v/gh_${v}_linux_$a.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_$a/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git config user.name harness-bot && git config user.email harness-bot@users.noreply.github.com
          sh scripts/collab.sh prune
          git diff --cached --quiet && exit 0
          git commit -m "chore(collab): prune claims"
          # main 이 보호돼 있으면 직접 push 가 막힌다 → PR 을 열고 auto-merge 로 넘긴다
          if ! COLLAB_ALLOW_PROTECTED_PUSH=1 git push 2>/dev/null; then
            # main 이 보호돼 있으면 PR 로. 브랜치는 하나를 재사용한다 (매번 새로 만들면 원격에 쌓인다)
            b="chore/collab-prune"
            git switch -c "$b" 2>/dev/null || git switch "$b"
            # 프로젝트의 강제 push 금지 정책: 기존 봇 브랜치 이력을 합쳐 일반 push 한다.
            if git show-ref --verify --quiet "refs/remotes/origin/$b"; then
              git merge --no-edit "origin/$b"
            fi
            git push -q -u origin "$b"
            n="$(gh pr list --head "$b" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$n" ]; then echo "기존 PR #$n 갱신"; else
              gh pr create --title "chore(collab): prune claims" --body "머지된 브랜치의 claim 정리 (CI 자동). 승인하면 auto-merge 됩니다." && gh pr merge --auto --squash "$b" || true
            fi
          fi
