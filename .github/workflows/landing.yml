name: landing-check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    name: 랜딩 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:demo
      - run: npm run build
      - run: python3 tests/check-static-paths.py dist/client
      - name: GitHub Pages 하위 경로 빌드
        env:
          NEXT_PUBLIC_BASE_PATH: /cairn-engine
        run: npm run build
      - name: Pages 산출물 포장 및 경로 검증
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          python3 tests/check-static-paths.py dist/pages /cairn-engine
