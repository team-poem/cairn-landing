name: landing-check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landing:
    name: 랜딩 검증
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'poem-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:demo
      - run: npm run build
      - run: python3 tests/check-static-paths.py dist/client
      - run: python3 tests/check-seo.py dist/client
      - name: GitHub Pages 하위 경로 빌드
        env:
          NEXT_PUBLIC_BASE_PATH: /cairn-engine
        run: npm run build
      - name: Pages 산출물 포장 및 경로 검증
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/prepare-pages.py
          python3 tests/check-static-paths.py dist/pages /cairn-engine
          python3 tests/check-seo.py dist/pages /cairn-engine
