<?xml version='1.0' encoding='utf-8'?>
<!-- 안개. feTurbulence 프랙탈 노이즈를 알파로 바꿔 형태가 흩어진 수증기처럼 보이게 한다.
     같은 노이즈를 원본과 좌우 반전본으로 이어 붙여 타일 경계가 수학적으로 연속이다.
     stitchTiles 는 브라우저마다 어긋나 띠가 생기므로 쓰지 않는다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="600" viewBox="0 0 2800 600">
  <defs>
    <filter id="fog" x="0" y="0" width="1400" height="600" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence x="0" y="0" width="1400" height="600" type="fractalNoise" baseFrequency="0.0036 0.007" numOctaves="5" seed="23" result="n" />
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.76
                0 0 0 0 0.81
                0 0 0 0 0.92
                0 0 0 2.2 -0.9" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.04 0.2 0.46 0.74" />
      </feComponentTransfer>
    </filter>
    <rect id="half" x="0" y="0" width="1400" height="600" filter="url(#fog)" />
  </defs>
  <use href="#half" />
  <use href="#half" transform="translate(2800 0) scale(-1 1)" />
</svg>
