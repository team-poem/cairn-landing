<?xml version='1.0' encoding='utf-8'?>
<!-- 안개. feTurbulence 프랙탈 노이즈를 알파로 바꿔 형태가 흩어진 수증기처럼 보이게 한다.
     stitchTiles 로 가로 이음새가 없어 repeat-x 로 흘릴 수 있다. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
  <filter id="fog" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0045" numOctaves="5" seed="7" stitchTiles="stitch" result="n" />
    <!-- 노이즈의 알파를 안개 농도로. 밝은 곳만 남기고 색은 청회색으로 고정 -->
    <feColorMatrix in="n" type="matrix"
      values="0 0 0 0 0.76
              0 0 0 0 0.81
              0 0 0 0 0.92
              0 0 0 2.4 -0.9" />
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0 0.08 0.3 0.62 0.9" />
    </feComponentTransfer>
    <feGaussianBlur stdDeviation="1.2" />
  </filter>
  <rect width="1400" height="600" filter="url(#fog)" />
</svg>
